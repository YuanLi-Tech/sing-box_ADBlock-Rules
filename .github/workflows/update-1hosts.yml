name: Update 1Hosts Lite

on:
  schedule:
    # 每天 04:00 UTC = 北京时间 12:00（错开上游更新时段，次日同步）
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download 1Hosts Lite
        run: |
          curl -sSL -o 1hosts-lite.txt https://raw.githubusercontent.com/badmojr/1Hosts/master/Lite/domains.txt
          wc -l 1hosts-lite.txt

      - name: Convert to sing-box JSON
        run: python3 convert.py 1hosts-lite.txt 1hosts-lite.json

      - name: Download sing-box and compile
        run: |
          curl -sSL -o sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz
          tar xzf sing-box.tar.gz
          ./sing-box-1.14.0-linux-amd64/sing-box rule-set compile --output 1hosts-lite.srs 1hosts-lite.json
          ls -la 1hosts-lite.srs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1hosts-lite.srs
          if git diff --cached --quiet; then
            echo "No changes since last run, skip push"
            exit 0
          fi
          git commit -m "Update 1Hosts Lite $(date -u +%F)"
          git push
